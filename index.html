<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Productivity Dashboard</title>
		<link
			href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			
			<section class="allElems">
				<div class="todo elem" id="0">
					<img
						src="https://plus.unsplash.com/premium_photo-1710962184909-f9f8dc2c9f5f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
						alt=""
					/>
					<h2>To Do List</h2>
				</div>
				<div class="daily elem" id="1">
					<img
						src="https://images.unsplash.com/photo-1601315488950-3b5047998b38?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
						alt=""
					/>
					<h2>Daily Planner</h2>
				</div>
				<div class="moti elem" id="2">
					<img
						src="https://images.unsplash.com/photo-1678986718987-76f0b9357e0f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
						alt=""
					/>
					<h2>Motivation</h2>
				</div>
				<div class="pomo elem" id="3">
					<img
						src="https://images.unsplash.com/photo-1677249490921-3246e81f19e3?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
						alt=""
					/>
					<h2>Pomodoro Timer</h2>
				</div>
				<div class="daily elem" id="4">
					<img
						src="https://images.unsplash.com/photo-1718202248232-0cdbc15d29b2?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
						alt=""
					/>
					<h2>Daily Goals</h2>
				</div>
			</section>

			<section class="fullElems todo-list-fullpage">
				<button class="back" id="0">close</button>
				<h2>Your Personalized Tasks List</h2>
				<div class="todo-container">
					<div class="addTask">
						<form >
							<input type="text" placeholder="Enter your task">
							<textarea name="" id="" placeholder="Enter description here" cols="30" rows="4"></textarea>
							<div class="mark-imp">
								<input type="checkbox" id="check">
								<label for="check">Mark as Important!</label>
							</div>
							<button type="submit">Add Task</button>
						</form>
					</div>
					<div class="allTask">
						
					</div>
				</div>
			</section>

			<section class="fullElems daily-planner-fullpage">
				<button class="back" id="1">close</button>
				<h2>Daily Planner</h2>
			</section>
			<section class="fullElems motivational-fullpage">
				<button class="back" id="2">close</button>
				<h2>Motivation</h2>
			</section>
			<section class="fullElems pomodoro-fullpage">
				<button class="back" id="3">close</button>
				<h2>Pomodoro Timer</h2>
			</section>
			<section class="fullElems daily-goals-fullpage">
				<button class="back" id="4">close</button>
				<h2>Daily Goals</h2>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
